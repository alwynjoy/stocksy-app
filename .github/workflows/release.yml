name: Release Stocksy Desktop

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target GitHub Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Create/update as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Cache portable Python
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/python
          key: portable-python-${{ runner.os }}-${{ hashFiles('py-scripts/requirements.txt') }}

      - name: Setup portable Python
        shell: bash
        run: bash scripts/setup-portable-python.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Tauri NSIS bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundle nsis

      - name: Upload bundle artifacts to run
        uses: actions/upload-artifact@v4
        with:
          name: stocksy-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*

      - name: Attach Windows .exe installer to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
